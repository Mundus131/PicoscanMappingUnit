name: Build Docker Artifacts (ARM64)

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  test-capture:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install isolated regression-test dependencies
        run: python -m pip install numpy==1.26.2 -r integrations/opcua_server/requirements.txt
      - name: Install pinned scanner parser for compatibility tests
        run: python -m pip install --no-deps "$(grep '^scansegmentapi ' backend/requirements.txt)"
      - name: Test capture, quality and OPC UA contracts
        env:
          PYTHONPATH: backend
        run: |
          python -m unittest discover -s backend/tests
          python -m unittest discover -s integrations/opcua_server -p test_quality.py
          python -m compileall -q backend/app integrations

  build-backend:
    needs: test-capture
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Allow detailed pip diagnostics without BuildKit's small default log cap.
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=52428800
            env.BUILDKIT_STEP_LOG_MAX_SPEED=1048576

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image (arm64) and push to GHCR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs
          docker buildx build --progress=plain \
            --platform linux/arm64/v8 \
            -t ghcr.io/mundus131/picoscan-backend:arm64 \
            -t ghcr.io/mundus131/picoscan-backend:sha-${{ github.sha }} \
            -f backend/Dockerfile \
            backend --push 2>&1 | tee build-logs/backend-push.log

      - name: Build backend image (arm64) and export tar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs
          docker buildx build --progress=plain \
            --platform linux/arm64/v8 \
            -t picocan-backend:arm64 \
            -f backend/Dockerfile \
            backend --output type=docker,dest=backend-arm64.tar \
            2>&1 | tee build-logs/backend-export.log

      - name: Upload backend build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-logs
          path: build-logs/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: picocan-backend-arm64
          path: backend-arm64.tar

  build-opcua:
    needs: test-capture
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build OPC UA image (arm64) and push to GHCR
        run: >
          docker buildx build
          --platform linux/arm64/v8
          -t ghcr.io/mundus131/picocan-opcua-server:arm64
          -t ghcr.io/mundus131/picocan-opcua-server:sha-${{ github.sha }}
          -f integrations/opcua_server/Dockerfile
          integrations/opcua_server
          --push

      - name: Build OPC UA image (arm64) and export tar
        run: >
          docker buildx build
          --platform linux/arm64/v8
          -t picocan-opcua-server:arm64
          -f integrations/opcua_server/Dockerfile
          integrations/opcua_server
          --output type=docker,dest=opcua-arm64.tar

      - name: Upload OPC UA artifact
        uses: actions/upload-artifact@v4
        with:
          name: picocan-opcua-server-arm64
          path: opcua-arm64.tar

  build-frontend:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend image (arm64) and push to GHCR
        run: >
          docker buildx build
          --platform linux/arm64/v8
          -t ghcr.io/mundus131/picoscan-frontend:arm64
          -t ghcr.io/mundus131/picoscan-frontend:sha-${{ github.sha }}
          -f frontend/Dockerfile
          frontend
          --push

      - name: Build frontend image (arm64) and export tar
        run: >
          docker buildx build
          --platform linux/arm64/v8
          -t picocan-frontend:arm64
          -f frontend/Dockerfile
          frontend
          --output type=docker,dest=frontend-arm64.tar

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: picocan-frontend-arm64
          path: frontend-arm64.tar
