version: "3.9"

services:
  backend:
    image: ghcr.io/mundus131/picocan-backend:arm64
    container_name: picocan-backend
    restart: unless-stopped
    network_mode: host
    dns:
      - 192.168.0.1
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      - LOG_LEVEL=INFO
      - MQTT_PUBLISH_ENABLED=true
      - MQTT_HOST=127.0.0.1
      - MQTT_PORT=1883
      - MQTT_TOPIC_ROOT=picocan/pmu
      - OPCUA_NAMESPACE_URI=urn:picocan:mapping-unit
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","http://192.168.0.100:3000"]
    volumes:
      - backend_logs:/app/logs
      - backend_data:/app/data
      # optional: persistent scanner config from host
      # - ./backend/config/picoscans_config.json:/app/config/picoscans_config.json

  frontend:
    image: ghcr.io/mundus131/picocan-frontend:arm64
    container_name: picocan-frontend
    restart: unless-stopped
    dns:
      - 192.168.0.1
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "3000:3000/tcp"
    depends_on:
      - backend
    networks:
      - picocan_net

  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: picocan-mqtt-broker
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./integrations/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  opcua-server:
    image: ghcr.io/mundus131/picocan-opcua-server:arm64
    container_name: picocan-opcua-server
    restart: unless-stopped
    network_mode: host
    environment:
      - BACKEND_BASE_URL=http://127.0.0.1:8000/api/v1
      - MQTT_TOPIC_ROOT=picocan/pmu
      - OPCUA_NAMESPACE_URI=urn:picocan:mapping-unit
      - OPCUA_ENDPOINT=opc.tcp://0.0.0.0:4840/freeopcua/server/
      - POLL_INTERVAL_S=1.0
    depends_on:
      - backend
      - mqtt-broker

networks:
  picocan_net:
    driver: bridge

volumes:
  backend_logs:
  backend_data:
